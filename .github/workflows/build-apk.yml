name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is: ${JAVA_HOME:-undefined}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_OUTPUT" | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')

          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Failed to detect Java major version." >&2
            exit 1
          fi

          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or higher. Found: $JAVA_MAJOR" >&2
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYSTORE_FILE="./debug.keystore"
          if [ -f "$KEYSTORE_FILE" ]; then
            echo "Temporary debug keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore "$KEYSTORE_FILE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "ERROR: Failed to create temporary debug keystore at $KEYSTORE_FILE" >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk for generated APK files:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is empty." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $EXPECTED_APK" >&2; exit 1 ;;
          esac

          APK_SIZE=$(stat -c%s "$EXPECTED_APK")
          echo "Verified APK: $EXPECTED_APK (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          STAGING_DIR="${RUNNER_TEMP}/apk-release-staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_NAME=$(echo "$REPO_NAME" | tr -c 'a-zA-Z0-9_-' '-' | sed 's/^-//; s/-$//')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="android-app"
          fi

          ASSET_FILENAME="${SANITIZED_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_PATH="${STAGING_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$DEST_PATH"

          if [ ! -s "$DEST_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty at $DEST_PATH" >&2
            exit 1
          fi

          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== Checking GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty at $ASSET_PATH" >&2
            exit 1
          fi

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### 📱 Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run Number:** ${GITHUB_RUN_NUMBER}
          - **Build Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Commit SHA:** ${GITHUB_SHA}
          - **Asset Name:** \`${ASSET_NAME}\`

          > **Notice:**
          > - This APK is intended solely for testing and evaluation purposes.
          > - It is not a production release for the Google Play Store.
          > - The APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $TAG..."
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

          echo "Release created successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"

          echo "=== APK Download & Release Report ==="

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            gh release view "$TAG" || true
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release Page: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded

          Your debug APK has been published to GitHub Releases:
          - **Release Tag:** \`${TAG}\`
          - **Release URL:** [View Release and Download APK](${RELEASE_URL})
          - **APK Asset Filename:** \`${ASSET_NAME}\`

          You can download and install the APK directly onto an Android device from the **Assets** section of the release page above.

          📦 **Backup Actions Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also stored with this workflow run.
          EOF
          else
            echo "WARNING: Release publishing failed or was skipped. The debug APK build itself succeeded."
            echo "The GitHub Actions artifact 'app-debug-apk' remains fully available for download."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Build Succeeded (Release Publishing Warning)

          The debug APK was built and verified successfully, and the GitHub Actions artifact has been uploaded. However, automatic GitHub Release publishing did not complete.

          📦 **Download Instructions:**
          You can download the compiled APK directly from the **Artifacts** section of this GitHub Actions run summary under the name **\`app-debug-apk\`**.
          EOF
          fi
